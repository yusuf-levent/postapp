name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            config
            data
            scripts
            tests
            assets
            .github

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Testleri çalıştır
        run: python -m pytest tests/ -v --tb=short

      - name: Render bağımlılıkları
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-color-emoji

      - name: Gerçek tarayıcı ve video smoke testi
        run: python scripts/smoke_render.py
