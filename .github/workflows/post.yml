name: post

on:
  schedule:
    # UTC: 09:00, 12:00, 15:00, 18:00, 21:00 Europe/Istanbul (UTC+3)
    # Her slot saatinde 15 dakikada bir (02, 17, 32, 47) kontrol eder; slot zaten
    # yayınlanmışsa 2 saniyelik hızlı ön-kontrol ile hiçbir paket kurmadan çıkar.
    - cron: "2,17,32,47 6,9,12,15,18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: "Paylaşma, sadece üret"
      force_type:
        type: choice
        options: [auto, news, edu]
        default: auto

concurrency:
  group: tekno-pusula
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Slot durumunu kontrol et (hızlı ön-kontrol)
        id: slot-check
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, time, timedelta
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/Istanbul"))
          today = now.strftime("%Y-%m-%d")
          slots = ["09:00", "12:00", "15:00", "18:00", "21:00"]
          best_slot = slots[0]
          best_delta = timedelta(hours=99)
          for s in slots:
              hh, mm = map(int, s.split(":"))
              dt = datetime.combine(now.date(), time(hh, mm), tzinfo=now.tzinfo)
              delta = abs(now - dt)
              if delta < best_delta:
                  best_delta = delta
                  best_slot = s

          done = False
          needs_recovery = False
          try:
              data = json.load(open("data/history.json", encoding="utf-8"))
              for p in data.get("posts", []):
                  if p.get("date") == today:
                      statuses = p.get("status_per_platform", [])
                      if any(st.get("state") in ("failed", "pending") for st in statuses):
                          needs_recovery = True
                      if p.get("slot") == best_slot and statuses and all(st.get("state") == "published" for st in statuses):
                          done = True
          except Exception:
              pass

          should_skip = done and not needs_recovery
          print(f"Tarih: {today}, En yakın slot: {best_slot}, Tamamlandı: {done}, Kurtarma gerekli: {needs_recovery} -> skip={should_skip}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"skip={'true' if should_skip else 'false'}\n")
          PY

      - name: Python kur
        if: steps.slot-check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        if: steps.slot-check.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright tarayıcılarını kur (cache'li)
        if: steps.slot-check.outputs.skip != 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Playwright Chromium kur
        if: steps.slot-check.outputs.skip != 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Sistem fontlarını ve FFmpeg'i kur
        if: steps.slot-check.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji fonts-noto-core ffmpeg

      - name: Google Fonts indir (cache'li)
        if: steps.slot-check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: assets/fonts
          key: fonts-v1

      - name: Fontları hazırla
        if: steps.slot-check.outputs.skip != 'true'
        run: python -m app.render.fonts

      - name: Post üret
        if: steps.slot-check.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.1-flash-lite' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BUFFER_ACCESS_TOKEN_A: ${{ secrets.BUFFER_ACCESS_TOKEN_A }}
          BUFFER_ACCESS_TOKEN_B: ${{ secrets.BUFFER_ACCESS_TOKEN_B }}
          BUFFER_PROFILE_INSTAGRAM: ${{ secrets.BUFFER_PROFILE_INSTAGRAM }}
          BUFFER_PROFILE_TIKTOK: ${{ secrets.BUFFER_PROFILE_TIKTOK }}
          BUFFER_PROFILE_X: ${{ secrets.BUFFER_PROFILE_X }}
          BUFFER_PROFILE_FACEBOOK: ${{ secrets.BUFFER_PROFILE_FACEBOOK }}
          BUFFER_PROFILE_LINKEDIN: ${{ secrets.BUFFER_PROFILE_LINKEDIN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          python -m app.main \
            --slot auto \
            --type "${{ github.event.inputs.force_type || 'auto' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}