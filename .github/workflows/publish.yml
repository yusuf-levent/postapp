name: post

on:
  schedule:
    # Her 5 dakikada bir kontrol eder; bekleyen veya geciken slot varsa tamamlar,
    # tüm slotlar zaten yayınlanmışsa birkaç saniyede çıkar (idempotent).
    # GitHub cron gecikmeleri/ertelenmeleri için sık kontrol şarttır.
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "data/slot_trigger.txt"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: "Paylaşma, sadece üret"
      force_type:
        type: choice
        options: [auto, news, edu]
        default: auto

concurrency:
  group: tekno-pusula-${{ github.event.inputs.dry_run == 'true' && github.ref || 'publish' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Güncel slot kontrolü
        id: slots
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          python -m pip install pyyaml
          python scripts/check_due.py

      - name: Bağımlılıkları kur
        if: steps.slots.outputs.due == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright tarayıcılarını kur (cache'li)
        if: steps.slots.outputs.due == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v2-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Playwright Chromium kur
        if: steps.slots.outputs.due == 'true'
        # Always verify the browser revision required by the installed package.
        # A cache hit only means a directory exists, not that it is compatible.
        run: python -m playwright install --with-deps chromium

      - name: Sistem fontlarını ve FFmpeg'i kur
        if: steps.slots.outputs.due == 'true'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji fonts-noto-core ffmpeg

      - name: Google Fonts indir (cache'li)
        if: steps.slots.outputs.due == 'true'
        uses: actions/cache@v4
        with:
          path: assets/fonts
          key: fonts-v1

      - name: Fontları hazırla
        if: steps.slots.outputs.due == 'true'
        run: python -m app.render.fonts

      - name: Post üret
        if: steps.slots.outputs.due == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BACKUP_API_KEY: ${{ secrets.GEMINI_BACKUP_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.1-flash-lite' }}
          GEMINI_ENABLE_GROUNDING: ${{ vars.GEMINI_ENABLE_GROUNDING || 'false' }}
          TEXT_FALLBACK_API_KEY: ${{ secrets.TEXT_FALLBACK_API_KEY }}
          TEXT_FALLBACK_BASE_URL: ${{ vars.TEXT_FALLBACK_BASE_URL || 'https://api.groq.com/openai/v1' }}
          TEXT_FALLBACK_MODEL: ${{ vars.TEXT_FALLBACK_MODEL || 'llama-3.3-70b-versatile' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          BUFFER_ACCESS_TOKEN_A: ${{ secrets.BUFFER_ACCESS_TOKEN_A }}
          BUFFER_ACCESS_TOKEN_B: ${{ secrets.BUFFER_ACCESS_TOKEN_B }}
          BUFFER_PROFILE_INSTAGRAM: ${{ secrets.BUFFER_PROFILE_INSTAGRAM }}
          BUFFER_PROFILE_TIKTOK: ${{ secrets.BUFFER_PROFILE_TIKTOK }}
          BUFFER_PROFILE_X: ${{ secrets.BUFFER_PROFILE_X }}
          BUFFER_PROFILE_FACEBOOK: ${{ secrets.BUFFER_PROFILE_FACEBOOK }}
          BUFFER_PROFILE_LINKEDIN: ${{ secrets.BUFFER_PROFILE_LINKEDIN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          python -m app.main \
            --slot auto \
            --type "${{ github.event.inputs.force_type || 'auto' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Önizleme ve hata dosyalarını sakla
        if: always() && steps.slots.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: post-preview-${{ github.run_id }}
          path: output/${{ steps.slots.outputs.date }}/
          retention-days: 7
          if-no-files-found: ignore
